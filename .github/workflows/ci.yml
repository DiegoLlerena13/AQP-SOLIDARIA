
name: AQP-SOLIDARIA CI

on:
  push:
    branches:
      - main
      - feature/infra
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-infrastructure:
    name: Validar infraestructura AWS
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar cfn-lint
        run: python -m pip install cfn-lint

      - name: Instalar AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validar plantilla SAM
        run: sam validate --template-file infra/template.yaml --region us-east-1 --lint

      - name: Compilar infraestructura
        run: sam build --template-file infra/template.yaml --region us-east-1
