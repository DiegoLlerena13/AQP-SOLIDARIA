
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: AQP-SOLIDARIA - Infraestructura inicial

Resources:
  HealthApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: academic

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/health/
      Handler: handler.handler
      Runtime: nodejs22.x
      MemorySize: 128
      Timeout: 5

      Events:
        HealthEndpoint:
          Type: HttpApi
          Properties:
            ApiId: !Ref HealthApi
            Path: /health
            Method: GET

Outputs:
  HealthApiUrl:
    Description: URL del endpoint de prueba
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/academic/health"
      - ApiId: !Ref HealthApi
